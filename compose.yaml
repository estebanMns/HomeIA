services:
  postgres:
    image: 'postgres:17.6'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'

  # Copia diaria con pg_dump y retención de BACKUP_KEEP_DAYS días (ver scripts/backup-db.sh).
  backup:
    image: 'postgres:17.6'
    depends_on: [postgres]
    environment:
      - 'PGHOST=postgres'
      - 'PGUSER=myuser'
      - 'PGDATABASE=mydatabase'
      - 'PGPASSWORD=${POSTGRES_PASSWORD}'
      - 'BACKUP_DIR=/backups'
      - 'BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}'
    entrypoint: ['/bin/sh', '-c', 'while true; do /scripts/backup-db.sh; sleep 86400; done']
    volumes:
      - './scripts:/scripts:ro'
      - './backups:/backups'

volumes:
  postgres-data:
