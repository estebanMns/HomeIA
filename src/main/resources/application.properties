spring.application.name=HomeIA

# Server
server.port=8080

# Database (ajusta estos valores según tu configuración local)
spring.datasource.url=jdbc:postgresql://localhost:5432/homeIA
spring.datasource.username=homeIA
spring.datasource.password=homeIA
# Si no tienes PostgreSQL, puedes usar H2 (base de datos embebida) para desarrollo
# Descomenta las siguientes líneas y comenta las de PostgreSQL arriba
# spring.datasource.url=jdbc:h2:mem:homeIA
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.baselineOnMigrate=true
spring.flyway.locations=classpath:db/migration

# Application Configuration
app.automation.occupancy-threshold-minutes=15
app.automation.occupancy-probability-threshold=0.7

# Logging
logging.level.root=INFO
logging.level.com.home.ia=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# MQTT Configuration
mqtt.enabled=false
mqtt.broker-url=tcp://localhost:1883
mqtt.username=
mqtt.password=
mqtt.client-id=homeIA-client

# WhatsApp Configuration
whatsapp.enabled=false
whatsapp.api.url=https://api.whatsapp.com
whatsapp.api.token=
whatsapp.phone.number=

# WebSocket Configuration
spring.websocket.enabled=true

# Docker Compose (opcional - deshabilitar si no tienes Docker instalado)
spring.docker.compose.enabled=false

# Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY}
gemini.model-id=gemini-2.0-flash
