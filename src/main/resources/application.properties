spring.application.name=HomeIA

# Variables de entorno: se leen de ./.env (las variables del sistema tienen prioridad).
# DATABASE_URL se convierte a JDBC en DatabaseUrlEnvironmentPostProcessor.
spring.config.import=optional:file:./.env[.properties]

server.port=${PORT:8080}

# Base de datos PostgreSQL (schema propio "homeia", separado de otros proyectos)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=homeia
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/homeia/migration
spring.flyway.schemas=homeia
spring.flyway.default-schema=homeia
spring.flyway.create-schemas=true

# Seguridad
homeia.jwt.secret=${SECRET_KEY}
homeia.jwt.access-token-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:60}
homeia.jwt.refresh-token-minutes=${REFRESH_TOKEN_EXPIRE_MINUTES:10080}
homeia.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Correo (restablecimiento de contraseña). Sin SMTP_HOST el correo no se envía y se registra en el log.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
homeia.mail.from=${MAIL_FROM:no-reply@homeia.local}
homeia.frontend-url=${FRONTEND_URL:http://localhost:3000}
homeia.password-reset.minutes=${PASSWORD_RESET_MINUTES:30}

# MQTT (dispositivos IoT)
homeia.mqtt.enabled=${MQTT_ENABLED:false}
homeia.mqtt.broker-url=${MQTT_BROKER_URL:}
homeia.mqtt.username=${MQTT_USERNAME:}
homeia.mqtt.password=${MQTT_PASSWORD:}
homeia.mqtt.client-id=${MQTT_CLIENT_ID:homeia-backend}
homeia.mqtt.topic-prefix=${MQTT_TOPIC_PREFIX:homeia/devices}

# WhatsApp Cloud API (Meta)
homeia.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
homeia.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
homeia.whatsapp.api-base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}

# Gemini (predicción de ocupación)
homeia.gemini.api-key=${GEMINI_API_KEY:}
homeia.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
homeia.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
# Cada cuántos segundos la IA recalcula las decisiones de encendido/apagado de cada casa
homeia.gemini.decision-interval-seconds=${GEMINI_DECISION_INTERVAL_SECONDS:60}

# Valores iniciales de la casa (el registro solo pide la cuenta)
# Tarifa: costo unitario del recibo de energía (CUv, COP por kWh).
homeia.defaults.home-name=${DEFAULT_HOME_NAME:Mi casa}
homeia.defaults.currency=${DEFAULT_CURRENCY:COP}
homeia.defaults.timezone=${DEFAULT_TIMEZONE:America/Bogota}
homeia.defaults.electricity-price-per-kwh=${DEFAULT_ELECTRICITY_PRICE_PER_KWH:983.19}
homeia.defaults.vacancy-minutes=${DEFAULT_VACANCY_MINUTES:15}
homeia.defaults.return-sensitivity-percent=${DEFAULT_RETURN_SENSITIVITY_PERCENT:70}
homeia.defaults.consumption-alert-watts=${DEFAULT_CONSUMPTION_ALERT_WATTS:1500}
homeia.defaults.leak-minutes=${DEFAULT_LEAK_MINUTES:60}

# Motor de automatización
homeia.automation.cycle-seconds=${AUTOMATION_CYCLE_SECONDS:30}

spring.docker.compose.enabled=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

logging.level.com.homeia=INFO
