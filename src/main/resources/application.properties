spring.application.name=HomeIA

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/homeIA
spring.datasource.username=homeIA
spring.datasource.password=homeIA
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.baselineOnMigrate=true
spring.flyway.locations=classpath:db/migration

# Application Configuration
app.automation.occupancy-threshold-minutes=15
app.automation.occupancy-probability-threshold=0.7

# Logging
logging.level.root=INFO
logging.level.com.home.ia=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
