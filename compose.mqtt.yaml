# Broker MQTT local para desarrollo y dispositivos propios (ESP32). Ver docs/MQTT.md.
# Levantar:  docker compose -f compose.mqtt.yaml up -d
# Usuarios separados con ACL (docker/mosquitto/acl): homeia-backend, zigbee2mqtt, cada Edge y cada dispositivo.
# MQTT_USERNAME/MQTT_PASSWORD (usuario compartido heredado) siguen funcionando, pero no se recomiendan.
services:
  mosquitto:
    image: 'eclipse-mosquitto:2.0.20'
    container_name: homeia-mosquitto
    restart: unless-stopped
    ports:
      - '127.0.0.1:1883:1883'
    environment:
      MQTT_BACKEND_PASSWORD: '${MQTT_BACKEND_PASSWORD:-}'
      MQTT_ZIGBEE_PASSWORD: '${MQTT_ZIGBEE_PASSWORD:-}'
      HOMEIA_EDGE_ID: '${HOMEIA_EDGE_ID:-}'
      MQTT_EDGE_PASSWORD: '${MQTT_EDGE_PASSWORD:-}'
      MQTT_USERNAME: '${MQTT_USERNAME:-}'
      MQTT_PASSWORD: '${MQTT_PASSWORD:-}'
      MQTT_DEVICE_USERS: '${MQTT_DEVICE_USERS:-}'
    entrypoint: ['/bin/sh', '/mosquitto/config/init-users.sh']
    volumes:
      - './docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro'
      - './docker/mosquitto/acl:/mosquitto/config/acl:ro'
      - './docker/mosquitto/init-users.sh:/mosquitto/config/init-users.sh:ro'
      - 'mosquitto-data:/mosquitto/data'

volumes:
  mosquitto-data:
