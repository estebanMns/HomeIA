# Escucha en todas las interfaces para que los dispositivos de la red local puedan conectarse.
listener 1883 0.0.0.0

# Sin usuario y contraseña nadie se conecta: cualquiera en la red podría encender o apagar dispositivos.
allow_anonymous false
password_file /mosquitto/data/passwd

# Conserva los mensajes retenidos y las sesiones entre reinicios del contenedor.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
