# Broker LAN de HomeIA. NO publicar estos puertos en Internet (sin reenvío de puertos en el router).
# Para un backend fuera de la LAN usa una VPN o el broker en la nube con mTLS (mosquitto-cloud.conf).
per_listener_settings false

# 1883 sin TLS: solo para la LAN (ESP32, Zigbee2MQTT y el Edge en la misma máquina).
listener 1883 0.0.0.0

# 8883 con TLS (activar copiando certificados de docker/mosquitto/pki.sh en /mosquitto/certs).
#listener 8883 0.0.0.0
#cafile /mosquitto/certs/ca.crt
#certfile /mosquitto/certs/server.crt
#keyfile /mosquitto/certs/server.key
#tls_version tlsv1.2

# Sin usuario y contraseña nadie se conecta. Cada componente tiene su propio usuario (init-users.sh).
allow_anonymous false
password_file /mosquitto/data/passwd
# Mínimo privilegio por tópico.
# Generado en cada arranque por init-users.sh a partir de /mosquitto/config/acl.
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
