# Broker en la nube (VPS/Railway TCP) para que backend y Edge se encuentren sin abrir puertos en la casa.
# Solo TLS con certificado de cliente (mTLS): la identidad es el CN del certificado.
per_listener_settings false
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

allow_anonymous false
acl_file /mosquitto/config/acl-cloud

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
